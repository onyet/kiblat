name: kiblat
description: "App to find the Qibla direction"
publish_to: 'none'
version: 2.2.0+14

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.7
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_compass: ^0.8.1
  google_maps_flutter: ^2.10.0
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: 0.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  path: ^1.9.1
  permission_handler: ^11.3.1
  http: ^1.3.0
  camera: ^0.11.0+2
  sensors_plus: ^6.1.1
  sqflite_common_ffi: ^2.3.3
  flutter_native_splash: ^2.3.5
  adhan: ^2.0.0
  intl: ^0.20.0
  hijri: ^3.0.0
  timezone: ^0.10.1
  flutter_local_notifications: ^19.5.0
  home_widget: ^0.7.0
  file_picker: ^8.0.0+1
  path_provider: ^2.1.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo_padded.png
  android_12:
    image: assets/images/logo_padded.png
    color: "#ffffff"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/translations/
    - assets/audio/
